name: Run tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1', 'pre']
        os: [ubuntu-latest, windows-latest, macos-latest]
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
          arch: 'default'
      - name: Install dependencies and build
        env:
          PYTHON: # remove PYTHON env variable to make sure packages are installed
        uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        uses: julia-actions/julia-runtest@v1

  # Metal hardware tests. Metal.jl is never a dependency of Luna, so it is installed into
  # a throwaway environment stacked on the package rather than added to Project.toml, and
  # only this job installs it. GitHub's Apple Silicon runners (macos-14 and later) expose
  # a Metal device; test_metal.jl skips itself if Metal.functional() is false.
  metal:
    runs-on: macos-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
          arch: 'default'
      - name: Install Metal into a separate environment
        run: |
          julia --project=metalenv -e '
            using Pkg
            Pkg.develop(path=pwd())
            Pkg.add(["Metal", "Test", "GPUArraysCore", "Adapt"])
            Pkg.instantiate()'
      - name: Run the Metal tests
        run: |
          julia --project=metalenv -t 1 -e '
            using Luna, Metal
            Luna.set_fftw_mode(:estimate)
            Luna.set_fftw_threads(1)
            Luna.set_fftw_wisdom(false)
            include("test/test_metal.jl")'
