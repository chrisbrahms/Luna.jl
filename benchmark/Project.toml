# Environment for benchmark/run.jl. Separate from Luna's own Project.toml so that
# BenchmarkTools is not a Luna dependency. The [sources] entry below points it at the Luna
# in this worktree, so setting it up is just
#
#   julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
#
# from the repository root. The path is relative, which Pkg supports from Julia 1.11; this
# environment is a developer tool, so it does not have to match Luna's own compat range.
# Manifest.toml in this directory is gitignored.

[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Luna = "30eb0fb0-5147-11e9-3356-d75b018717ce"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"

[sources]
Luna = {path = ".."}

[compat]
BenchmarkTools = "1"
julia = "1.11"
